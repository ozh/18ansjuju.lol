<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAJEURE METAL</title>
<meta name="description" content="Juju a 18 ans. Majeure. Metal. Fin de la discussion.">
<meta property="og:title" content="MAJEURE METAL">
<meta property="og:description" content="Juju a 18 ans. Majeure. Metal. Fin de la discussion.">
<meta property="og:image" content="logo-640.jpg">
<link rel="icon" href="logo-640.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Anton&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff2fb3;
    --cyan: #19d3e6;
    --yellow: #ffe81a;
    --orange: #ff8a1c;
    --violet: #8a3cff;
    --beat: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }
  body { font-family: Anton, Impact, "Arial Black", sans-serif; }

  /* ---------- fond ---------- */
  #bg {
    position: fixed; inset: -50%;
    background: repeating-conic-gradient(from 0deg,
      var(--pink) 0deg 10deg, #000 10deg 20deg,
      var(--cyan) 20deg 30deg, #000 30deg 40deg,
      var(--yellow) 40deg 50deg, #000 50deg 60deg,
      var(--orange) 60deg 70deg, #000 70deg 80deg);
    opacity: .22;
    animation: spin 40s linear infinite;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.85) 75%, #000 100%);
  }
  #flash {
    position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.55), rgba(255,47,179,.25) 40%, transparent 70%);
    opacity: 0;
  }
  #flash.on { animation: flash .25s ease-out; }
  #sparks { position: fixed; inset: 0; pointer-events: none; }

  #stage-wrap {
    position: fixed; inset: 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
    align-items: center; justify-items: center;
  }
  body.beat #stage-wrap { animation: shake .18s linear; }

  /* ---------- titre ---------- */
  header { text-align: center; padding: 2.5vh calc(clamp(90px, 17vw, 230px) + 3vw) 0; position: relative; z-index: 5; }
  h1 {
    font-family: "Metal Mania", Impact, serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 7.5vw, 6.8rem);
    line-height: .95;
    letter-spacing: .02em;
    background: linear-gradient(180deg, #fff 0%, #ffe81a 35%, #ff8a1c 55%, #ff2fb3 80%, #8a3cff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 2px #000) drop-shadow(4px 4px 0 #000) drop-shadow(0 0 18px rgba(255,47,179,.8));
    transform: scale(calc(1 + var(--beat) * .08)) rotate(-2deg);
    position: relative;
  }
  h1::before, h1::after {
    content: attr(data-text); position: absolute; inset: 0;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; z-index: -1;
  }
  h1::before { background-image: linear-gradient(var(--cyan), var(--cyan)); transform: translate(-6px, 2px); }
  h1::after  { background-image: linear-gradient(var(--pink), var(--pink)); transform: translate(6px, -2px); }
  body.beat h1::before, body.beat h1::after { opacity: .8; }
  .sub {
    display: inline-block; margin-top: .4vh;
    font-size: clamp(.9rem, 2.4vw, 1.8rem);
    letter-spacing: .35em; text-transform: uppercase;
    background: #000; padding: .15em .8em; border: 3px solid var(--yellow);
    transform: rotate(1.5deg);
    box-shadow: 6px 6px 0 var(--pink);
  }

  /* ---------- logos ---------- */
  .logo {
    position: fixed; z-index: 4;
    width: clamp(90px, 17vw, 230px); aspect-ratio: 1;
    border-radius: 50%; overflow: hidden;
    border: 5px solid #000;
    box-shadow: 0 0 0 4px var(--yellow), 0 0 calc(20px + var(--beat) * 60px) var(--pink);
    transform: scale(calc(1 + var(--beat) * .18));
  }
  .logo img { width: 100%; height: 100%; display: block; animation: spin 9s linear infinite; }
  .logo.l { left: 2vw; top: 2vh; }
  .logo.r { right: 2vw; top: 2vh; }
  .logo.r img { animation-direction: reverse; }

  /* ---------- diaporama ---------- */
  #slides { position: relative; width: 100%; height: 100%; z-index: 3; }
  .slide {
    position: absolute; left: 50%; top: 50%;
    --rot: 0deg;
    width: max-content;
    transform: translate(-50%, -50%) rotate(var(--rot));
  }
  .slide .frame {
    background: #fff; padding: 10px 10px 10px;
    box-shadow:
      0 0 0 4px #000,
      0 0 0 9px var(--c1),
      0 0 0 13px #000,
      0 0 40px 10px var(--c1),
      0 20px 60px rgba(0,0,0,.9);
    transform: scale(calc(1 + var(--beat) * .04));
  }
  .slide img {
    display: block;
    max-width: min(78vw, 1000px);
    max-height: calc(100vh - 25rem);
    min-height: 200px;
    object-fit: contain;
    animation: kenburns 6s ease-in-out both;
  }
  .slide .imgbox { overflow: hidden; }
  .slide.in-slam   { animation: slam .55s cubic-bezier(.2,1.6,.4,1) both; }
  .slide.in-spin   { animation: spinIn .7s cubic-bezier(.2,1.3,.4,1) both; }
  .slide.in-left   { animation: fromLeft .5s cubic-bezier(.2,1.4,.4,1) both; }
  .slide.in-drop   { animation: drop .6s cubic-bezier(.3,1.7,.5,1) both; }
  .slide.out       { animation: out .45s ease-in both; }

  /* ---------- bandeau ---------- */
  footer { width: 100%; min-width: 0; overflow: hidden; position: relative; z-index: 5; padding-bottom: 2vh; }
  .marquee {
    overflow: hidden; white-space: nowrap;
    background: var(--yellow); color: #000;
    border-top: 5px solid #000; border-bottom: 5px solid #000;
    transform: rotate(-1.5deg) scaleX(1.05);
    font-size: clamp(1.2rem, 3.4vw, 2.6rem);
    padding: .1em 0;
  }
  .marquee.two { background: var(--pink); color: #fff; transform: rotate(1deg) scaleX(1.05); margin-top: -.3em; }
  .track { display: inline-block; animation: marquee 18s linear infinite; }
  .marquee.two .track { animation-direction: reverse; animation-duration: 24s; }
  .track span { padding: 0 .6em; }

  /* ---------- bouton son ---------- */
  #mute {
    position: fixed; left: 1vw; bottom: 1vh; z-index: 20;
    font: inherit; font-size: 1.1rem; cursor: pointer;
    background: #000; color: var(--yellow);
    border: 3px solid var(--yellow); padding: .3em .7em;
    box-shadow: 4px 4px 0 var(--cyan);
  }

  /* ---------- écran d'entrée ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
    background: radial-gradient(circle, #1a0010 0%, #000 70%);
    cursor: pointer; text-align: center; padding: 2rem;
  }
  #gate img {
    width: min(55vw, 45vh); border-radius: 50%;
    border: 6px solid #000; box-shadow: 0 0 0 5px var(--yellow), 0 0 80px var(--pink);
    animation: pulse 1s ease-in-out infinite;
  }
  #gate h1 { transform: rotate(-2deg); }
  #gate button {
    font: inherit; font-size: clamp(1.3rem, 4vw, 2.4rem);
    background: var(--pink); color: #fff; cursor: pointer;
    border: 5px solid #000; padding: .3em 1.2em;
    box-shadow: 8px 8px 0 var(--yellow), 0 0 40px var(--pink);
    text-transform: uppercase; letter-spacing: .08em;
    animation: wiggle .4s ease-in-out infinite alternate;
  }
  #gate.gone { animation: gateOut .6s cubic-bezier(.6,-0.4,.7,0) forwards; pointer-events: none; }

  /* ---------- écran de fin ---------- */
  #end {
    position: fixed; inset: 0; z-index: 50;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
    background: radial-gradient(circle, rgba(26,0,16,.92) 0%, rgba(0,0,0,.96) 70%);
    text-align: center; padding: 2rem;
  }
  #end.on { display: flex; animation: endIn .5s cubic-bezier(.2,1.4,.4,1) both; }
  #end h1 { transform: rotate(-2deg); }
  #end a {
    font-size: clamp(1.1rem, 3vw, 1.8rem); color: var(--cyan);
    text-transform: uppercase; letter-spacing: .08em;
    text-decoration: none; border-bottom: 3px solid var(--cyan);
  }
  #end a:hover { color: var(--yellow); border-color: var(--yellow); }
  #end button {
    font: inherit; font-size: clamp(1.3rem, 4vw, 2.4rem);
    background: var(--pink); color: #fff; cursor: pointer;
    border: 5px solid #000; padding: .3em 1.2em;
    box-shadow: 8px 8px 0 var(--yellow), 0 0 40px var(--pink);
    text-transform: uppercase; letter-spacing: .08em;
    animation: wiggle .4s ease-in-out infinite alternate;
  }

  /* ---------- animations ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  @keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(-7px, 4px) rotate(-.4deg); }
    50% { transform: translate(6px, -5px) rotate(.4deg); }
    75% { transform: translate(-4px, -3px); }
    100% { transform: translate(0,0); }
  }
  @keyframes kenburns { from { transform: scale(1.12) translate(2%, 1%); } to { transform: scale(1) translate(0,0); } }
  @keyframes slam {
    from { transform: translate(-50%, -50%) rotate(calc(var(--rot) * -3)) scale(4); opacity: 0; filter: blur(12px); }
    to   { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); opacity: 1; filter: blur(0); }
  }
  @keyframes spinIn {
    from { transform: translate(-50%, -50%) rotate(-720deg) scale(0); }
    to   { transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); }
  }
  @keyframes fromLeft {
    from { transform: translate(-250%, -50%) rotate(-30deg); }
    to   { transform: translate(-50%, -50%) rotate(var(--rot)); }
  }
  @keyframes drop {
    from { transform: translate(-50%, -250%) rotate(25deg); }
    to   { transform: translate(-50%, -50%) rotate(var(--rot)); }
  }
  @keyframes out {
    to { transform: translate(120%, 60%) rotate(40deg) scale(.4); opacity: 0; }
  }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes pulse { 50% { transform: scale(1.06) rotate(3deg); } }
  @keyframes wiggle { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.06); } }
  @keyframes endIn { from { transform: scale(.3) rotate(-10deg); opacity: 0; } }
  @keyframes gateOut { to { transform: scale(3) rotate(10deg); opacity: 0; } }

  @media (max-width: 700px) {
    .logo { width: 56px; border-width: 3px; box-shadow: 0 0 0 3px var(--yellow), 0 0 calc(10px + var(--beat) * 30px) var(--pink); }
    header { padding: 1.5vh 66px 0; }
    #stage-wrap h1 { font-size: 8.5vw; }
    .slide img { max-height: calc(100vh - 20rem); max-width: 86vw; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="sparks"></canvas>
<div id="vignette"></div>

<div id="stage-wrap">
  <header>
    <h1 data-text="MAJEURE METAL">MAJEURE METAL</h1>
    <div class="sub">Juju &middot; 18 ans &middot; 🤘</div>
  </header>
  <div id="slides"></div>
  <footer>
    <div class="marquee"><div class="track" id="m1"></div></div>
    <div class="marquee two"><div class="track" id="m2"></div></div>
  </footer>
</div>

<div class="logo l"><img src="logo-640.jpg" alt=""></div>
<div class="logo r"><img src="logo-640.jpg" alt=""></div>
<div id="flash"></div>
<button id="mute" type="button">🔊 SON</button>

<div id="gate">
  <img src="logo-640.jpg" alt="Logo Majeure Metal">
  <h1 data-text="MAJEURE METAL">MAJEURE METAL</h1>
  <button type="button">🤘 Branche l'ampli 🤘</button>
</div>

<div id="end">
  <h1 data-text="MAJEURE METAL">MAJEURE METAL</h1>
  <a href="https://suno.com/s/dsv1Xejr9gwifK0A" target="_blank" rel="noopener">🎸 Musique et paroles 🎸</a>
  <button type="button">🤘 Play again 🤘</button>
</div>

<audio id="song" src="MAJEURE-METAL.mp3" preload="auto"></audio>

<script>
(() => {
  const PHOTOS = [
    '20171231_203526.jpg', '20180602_190141.jpg', '20200102_193814.jpg',
    '20210808_121920.jpg', '20210808_155713.jpg', '20230101_001956.jpg',
    '20240519_173224.jpg', '20240519_222453.jpg', '20250411_193139.jpg',
    'IMAG1553.jpg', 'IMAG2170.jpg', 'IMG-20181012-WA0000.jpg', 'IMG-20191006-WA0006.jpg',
  ].map(f => 'photos/' + f);
  const COLORS = ['#ff2fb3', '#19d3e6', '#ffe81a', '#ff8a1c', '#8a3cff'];
  const ENTRIES = ['in-slam', 'in-spin', 'in-left', 'in-drop'];
  const SLIDE_MS = 3500;

  const song = document.getElementById('song');
  const gate = document.getElementById('gate');
  const slides = document.getElementById('slides');
  const flashEl = document.getElementById('flash');
  const muteBtn = document.getElementById('mute');
  const endEl = document.getElementById('end');
  const root = document.documentElement;

  // ---------- bandeaux ----------
  const fill = (el, words) => {
    const chunk = words.map(w => `<span>${w}</span>`).join('');
    el.innerHTML = chunk.repeat(6);
  };
  fill(document.getElementById('m1'),
    ['🤘 JUJU 18 ANS', '⚡ MAJEURE ET CHANMÉE', '🔥 HEADBANG OBLIGATOIRE', '🎂 LE GÂTEAU EST EN FEU', '🎸 TURN IT UP TO 11']);
  fill(document.getElementById('m2'),
    ['🎂 JOYEUX ANNIV JUJU 🎂', 'BÛCHERON COOL 🪓', '★ 18 ANS CDO ★', 'MAJEURE METAL', '★ PLUS FORT ★']);

  // ---------- préchargement ----------
  PHOTOS.forEach(src => { const i = new Image(); i.src = src; });

  // ---------- diaporama ----------
  let order = [], idx = 0, current = null;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.random() * a.length | 0];

  function nextSlide() {
    if (idx >= order.length) {
      const last = order[order.length - 1];
      order = shuffle([...PHOTOS]);
      if (order[0] === last) order.push(order.shift());
      idx = 0;
    }
    const el = document.createElement('div');
    el.className = 'slide ' + pick(ENTRIES);
    el.style.setProperty('--rot', (Math.random() * 14 - 7).toFixed(1) + 'deg');
    el.style.setProperty('--c1', pick(COLORS));
    el.innerHTML = `<div class="frame"><div class="imgbox"><img src="${order[idx++]}" alt=""></div></div>`;
    slides.appendChild(el);

    if (current) {
      const old = current;
      old.classList.add('out');
      old.addEventListener('animationend', () => old.remove(), { once: true });
      setTimeout(() => old.remove(), 800);
    }
    current = el;
    boom(1);
  }

  // ---------- étincelles ----------
  const cv = document.getElementById('sparks');
  const ctx = cv.getContext('2d');
  let W, H, sparks = [];
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  addEventListener('resize', resize); resize();

  function burst(n) {
    for (let k = 0; k < n; k++) {
      sparks.push({
        x: Math.random() * W, y: H + 10,
        vx: (Math.random() - .5) * 3, vy: -(4 + Math.random() * 9),
        life: 1, c: pick(COLORS), s: 1.5 + Math.random() * 3,
      });
    }
  }
  function drawSparks() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    sparks = sparks.filter(p => p.life > 0);
    for (const p of sparks) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.09; p.life -= 0.012;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill();
    }
  }

  // ---------- beat ----------
  let beat = 0, beatTimer = 0;
  function boom(strength) {
    beat = Math.min(1, Math.max(beat, strength));
    document.body.classList.remove('beat'); void document.body.offsetWidth;
    document.body.classList.add('beat');
    clearTimeout(beatTimer);
    beatTimer = setTimeout(() => document.body.classList.remove('beat'), 180);
    if (strength > .7) {
      flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');
    }
    burst(Math.round(10 + strength * 30));
  }

  // Analyse audio : réagit au vrai son quand c'est servi en http(s).
  // En file:// le navigateur rendrait le son muet, donc on simule un tempo.
  let analyser = null, data = null, avg = 0, lastBoom = 0;
  function setupAnalyser() {
    if (location.protocol === 'file:' || analyser) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC();
      const src = ac.createMediaElementSource(song);
      analyser = ac.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.6;
      src.connect(analyser); analyser.connect(ac.destination);
      data = new Uint8Array(analyser.frequencyBinCount);
      ac.resume();
    } catch (e) { analyser = null; }
  }

  function loop(t) {
    if (analyser && !song.paused) {
      analyser.getByteFrequencyData(data);
      let bass = 0;
      for (let i = 1; i < 10; i++) bass += data[i];
      bass /= 9 * 255;
      avg = avg * 0.94 + bass * 0.06;
      if (bass > avg * 1.18 && bass > 0.45 && t - lastBoom > 220) {
        lastBoom = t;
        boom(Math.min(1, (bass - avg) * 6 + 0.4));
      }
    } else if (!song.paused && t - lastBoom > 461) { // ~130 BPM
      lastBoom = t;
      boom(Math.random() < .25 ? 1 : .5);
    }
    if (Math.random() < 0.15) burst(1);
    beat *= 0.88;
    root.style.setProperty('--beat', beat.toFixed(3));
    drawSparks();
    requestAnimationFrame(loop);
  }

  // ---------- démarrage ----------
  let started = false, slideTimer = 0;
  function start() {
    if (started) return;
    started = true;
    setupAnalyser();
    song.volume = 1;
    song.play().catch(() => {});
    gate.classList.add('gone');
    setTimeout(() => gate.remove(), 700);
    nextSlide();
    slideTimer = setInterval(nextSlide, SLIDE_MS);
    requestAnimationFrame(loop);
  }

  // ---------- fin du morceau ----------
  song.addEventListener('ended', () => {
    clearInterval(slideTimer);
    endEl.classList.add('on');
  });
  endEl.querySelector('button').addEventListener('click', () => {
    endEl.classList.remove('on');
    song.currentTime = 0;
    song.play().catch(() => {});
    nextSlide();
    slideTimer = setInterval(nextSlide, SLIDE_MS);
  });
  gate.addEventListener('click', start);
  addEventListener('keydown', e => { if (!started && (e.key === 'Enter' || e.key === ' ')) start(); });

  muteBtn.addEventListener('click', () => {
    song.muted = !song.muted;
    muteBtn.textContent = song.muted ? '🔇 MUET' : '🔊 SON';
  });
})();
</script>
</body>
</html>
